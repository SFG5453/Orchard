# Intel build on an Apple silicon runner. Qt's macOS frameworks are universal.
[binaries]
c = ['ccache', 'clang', '-arch', 'x86_64']
cpp = ['ccache', 'clang++', '-arch', 'x86_64']
objc = ['ccache', 'clang', '-arch', 'x86_64']
objcpp = ['ccache', 'clang++', '-arch', 'x86_64']
ar = 'ar'
strip = 'strip'
cmake = 'cmake'

[built-in options]
c_link_args = ['-arch', 'x86_64']
cpp_link_args = ['-arch', 'x86_64']
objc_link_args = ['-arch', 'x86_64']
objcpp_link_args = ['-arch', 'x86_64']

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'darwin'
subsystem = 'macos'
kernel = 'xnu'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
