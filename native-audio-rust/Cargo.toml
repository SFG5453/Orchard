[package]
name = "orchard-audio"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

# `core` and `mobile` share this package's lock file and target directory. The vendored engine
# stays out: it is upstream code with its own test and benchmark suites, and pulling it in would
# put Criterion in the way of every `cargo test --workspace`.
[workspace]
members = ["core", "mobile"]
exclude = ["vendor/earmark"]

[lib]
name = "orchard_audio"
crate-type = ["cdylib"]

[dependencies]
# dyn-symbols resolves every napi_* symbol at runtime via the host executable
# rather than linking an import library. It is on by default, but we turn the
# defaults off, so it has to be named explicitly -- without it the Windows link
# fails on undefined napi symbols, since Electron ships no import lib to link.
napi = { version = "3.12.1", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = "3.6.3"
earmark = { path = "vendor/earmark" }
orchard-transition-core = { path = "core" }

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
strip = true

# What Android builds against. UniFFI keeps its interface metadata in ordinary, non-exported
# symbols and the Kotlin bindings are generated by reading them back out of the built library, so
# stripping here does not shrink the payload -- it makes the bindings impossible to generate. The
# Android packager strips the library on its way into the APK regardless.
[profile.android]
inherits = "release"
strip = false
