// JVM unit tests load the same QuickJS bridge compiled for the build machine,
// and the provider bytecode comes from that build's qjsc: same engine, same format.
def hostJsSource = file('src/main/cpp/js')
def hostJsBuild = layout.buildDirectory.dir('intermediates/hostJs').get().asFile
def hostQjsc = new File(hostJsBuild, 'quickjs/qjsc')
def quickJsSources = fileTree(rootProject.file('../../third_party/quickjs')) { include '*.c', '*.h', 'CMakeLists.txt' }
tasks.register('configureHostJs', Exec) {
    inputs.file new File(hostJsSource, 'CMakeLists.txt')
    outputs.file new File(hostJsBuild, 'CMakeCache.txt')
    environment 'JAVA_HOME', System.getProperty('java.home')
    commandLine 'cmake', '-S', hostJsSource.absolutePath, '-B', hostJsBuild.absolutePath,
        '-DCMAKE_BUILD_TYPE=Release'
}
tasks.register('buildHostJs', Exec) {
    dependsOn 'configureHostJs'
    inputs.dir hostJsSource
    inputs.files(fileTree(rootProject.file('../../core')) { include 'native/**' })
    inputs.files quickJsSources
    outputs.file new File(hostJsBuild, 'liborchard_js.so')
    outputs.file hostQjsc
    commandLine 'cmake', '--build', hostJsBuild.absolutePath, '--target', 'orchard_js', 'qjsc'
}
tasks.withType(Test).configureEach {
    dependsOn 'buildHostJs'
    systemProperty 'java.library.path', hostJsBuild.absolutePath
}

// The desktop YouTube provider, bundled and compiled exactly as CMakeLists.txt does it.
def providerSource = rootProject.file('../../providers/youtube')
def providerBundles = layout.buildDirectory.dir('intermediates/youtubeProvider').get().asFile
def providerInputs = fileTree(providerSource) {
    include 'src/**/*.js', 'scripts/*', 'package.json', 'package-lock.json'
}
tasks.register('bundleYouTubeProvider', Exec) {
    workingDir providerSource
    inputs.files providerInputs
    outputs.file new File(providerBundles, 'youtube-provider.js')
    commandLine 'npm', 'run', '--silent', 'build:runtime', '--',
        "--outfile=${new File(providerBundles, 'youtube-provider.js')}"
}
tasks.register('bundleYouTubePoMinter', Exec) {
    workingDir providerSource
    inputs.files providerInputs
    outputs.file new File(providerBundles, 'youtube-po-minter.js')
    outputs.file new File(providerBundles, 'youtube-po-minter-licenses.txt')
    commandLine 'npm', 'run', '--silent', 'build:po-minter', '--',
        "--outfile=${new File(providerBundles, 'youtube-po-minter.js')}"
}
tasks.register('compileYouTubeProvider', Exec) {
    dependsOn 'buildHostJs', 'bundleYouTubeProvider'
    inputs.file new File(providerBundles, 'youtube-provider.js')
    inputs.file hostQjsc
    outputs.file new File(providerBundles, 'youtube-provider.qjc')
    commandLine hostQjsc.absolutePath, '-b', '-C', '-n', 'youtube-provider.js',
        '-o', new File(providerBundles, 'youtube-provider.qjc').absolutePath,
        new File(providerBundles, 'youtube-provider.js').absolutePath
}
// Qobuz has no npm dependencies, so it borrows the YouTube provider's esbuild, as desktop does.
tasks.register('bundleQobuzProvider', Exec) {
    def source = rootProject.file('../../providers/qobuz')
    workingDir source
    inputs.files fileTree(source) { include 'src/**/*.js' }
    inputs.file new File(providerSource, 'package-lock.json')
    outputs.file new File(providerBundles, 'qobuz-provider.js')
    commandLine 'npm', '--prefix', providerSource.absolutePath, 'exec', '--offline', '--',
        'esbuild', new File(source, 'src/runtime.js').absolutePath, '--bundle', '--platform=browser',
        '--format=iife', '--target=es2023', '--legal-comments=none',
        "--outfile=${new File(providerBundles, 'qobuz-provider.js')}"
}
tasks.register('compileQobuzProvider', Exec) {
    dependsOn 'buildHostJs', 'bundleQobuzProvider'
    inputs.file new File(providerBundles, 'qobuz-provider.js')
    inputs.file hostQjsc
    outputs.file new File(providerBundles, 'qobuz-provider.qjc')
    commandLine hostQjsc.absolutePath, '-b', '-C', '-n', 'qobuz-provider.js',
        '-o', new File(providerBundles, 'qobuz-provider.qjc').absolutePath,
        new File(providerBundles, 'qobuz-provider.js').absolutePath
}
tasks.register('compileYouTubePoMinter', Exec) {
    dependsOn 'buildHostJs', 'bundleYouTubePoMinter'
    inputs.file new File(providerBundles, 'youtube-po-minter.js')
    inputs.file hostQjsc
    outputs.file new File(providerBundles, 'youtube-po-minter.qjc')
    commandLine hostQjsc.absolutePath, '-b', '-C', '-s', '-n', 'youtube-po-minter.js',
        '-o', new File(providerBundles, 'youtube-po-minter.qjc').absolutePath,
        new File(providerBundles, 'youtube-po-minter.js').absolutePath
}

// Copies the compiled provider into a variant's generated assets under providers/.
abstract class ProviderAssetsTask extends DefaultTask {
    @InputFiles abstract ConfigurableFileCollection getSources()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()

    @TaskAction void copy() {
        def target = new File(outputDirectory.get().asFile, 'providers')
        target.deleteDir()
        target.mkdirs()
        sources.each { source ->
            java.nio.file.Files.copy(source.toPath(), new File(target, source.name).toPath())
        }
    }
}
def providerAssetFiles = ['youtube-provider.qjc', 'youtube-po-minter.qjc', 'youtube-po-minter-licenses.txt', 'qobuz-provider.qjc']
    .collect { new File(providerBundles, it) }
// Registered through the variant API so every asset consumer, lint included, depends on it.
androidComponents {
    onVariants(selector().all()) { variant ->
        def task = tasks.register("${variant.name}YouTubeProviderAssets", ProviderAssetsTask) {
            dependsOn 'compileYouTubeProvider', 'compileYouTubePoMinter', 'compileQobuzProvider'
            sources.from(providerAssetFiles)
        }
        variant.sources.assets?.addGeneratedSourceDirectory(task) { it.outputDirectory }
    }
}
tasks.withType(Test).configureEach {
    dependsOn 'compileYouTubeProvider', 'compileYouTubePoMinter', 'compileQobuzProvider'
    systemProperty 'orchard.providerAssets', providerBundles.absolutePath
}

