<!doctype html>
<!-- Apple Music sign-in page for the Android WebView and the desktop auth helper. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Music</title>
<style>
html, body { margin: 0; height: 100%; background: #0e1520; color: #fff; font: 16px/1.4 system-ui, sans-serif; }
main { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; box-sizing: border-box; text-align: center; }
p { margin: 0; color: rgba(255, 255, 255, 0.72); }
button { font: inherit; font-weight: 600; border: 0; border-radius: 24px; padding: 12px 24px; background: #fa2d48; color: #fff; }
.spin { width: 32px; height: 32px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.2); border-top-color: #fff; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <div class="spin" id="spin"></div>
  <p id="status">Connecting to Apple Music…</p>
  <button id="signin" hidden>Sign in with Apple Music</button>
</main>
<script>
const status = document.getElementById('status');
const spin = document.getElementById('spin');
const button = document.getElementById('signin');

function post(message) {
  window.orchardAppleMusic.postMessage(JSON.stringify(message));
}

function showButton(text) {
  spin.hidden = true;
  status.textContent = text;
  button.hidden = false;
}

async function authorize(mk) {
  button.hidden = true;
  spin.hidden = false;
  status.textContent = 'Waiting for Apple Music…';
  try {
    const token = await mk.authorize();
    if (token) post({ type: 'authorized', token });
    else showButton('Apple Music did not finish signing in.');
  } catch (e) {
    showButton('Sign in to connect your Apple Music subscription.');
  }
}

async function boot() {
  // Android passes the developer token in the fragment; desktop injects it.
  const developerToken = window.orchardDeveloperToken || location.hash.slice(1);
  await new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://js-cdn.music.apple.com/musickit/v3/musickit.js';
    script.onload = resolve;
    script.onerror = () => reject(new Error('Could not load Apple Music.'));
    document.head.appendChild(script);
  });
  const mk = await MusicKit.configure({ developerToken, app: { name: 'Orchard', build: '1' } });
  button.onclick = () => authorize(mk);
  // A session left in the cookie jar authorizes without showing Apple's sign-in.
  if (mk.isAuthorized && mk.musicUserToken) post({ type: 'authorized', token: mk.musicUserToken });
  else showButton('Sign in to connect your Apple Music subscription.');
}

boot().catch((e) => post({ type: 'error', message: String(e && e.message || e) }));
</script>
</body>
</html>
