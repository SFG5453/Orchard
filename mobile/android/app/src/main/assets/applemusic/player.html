<!doctype html>
<!-- Apple Music playback for the desktop player helper and the Android WebView. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apple Music player</title>
</head>
<body>
<!-- One MusicKit player per deck. Same-origin srcdoc frames each get their own MusicKit singleton. -->
<template id="deck">
<meta charset="utf-8">
<script>
'use strict';
const NAME = window.name;
const host = parent.orchardDeckHost;

// MusicKit pauses every other player on this origin through this storage claim.
window.addEventListener('storage', (e) => { if (e.key === 'mk-player-tsid') e.stopImmediatePropagation(); }, true);

// Song -> fade (transitions, parking) -> volume -> speakers.
const context = new AudioContext();
const volume = context.createGain();
volume.connect(context.destination);
const output = context.createGain();
output.connect(volume);
let mk = null;
let active = null;
let songId = '';
let parked = false;
let finished = false;
let pendingSeek = -1;

function setFade(value) {
  output.gain.cancelScheduledValues(context.currentTime);
  output.gain.setValueAtTime(value, context.currentTime);
}

function playingElement() {
  return active && !active.paused ? active : null;
}

// MusicKit pools its media elements; route each one through this deck's graph.
const createElement = document.createElement.bind(document);
document.createElement = function (tag, options) {
  const element = createElement(tag, options);
  if (/^audio$/i.test(tag)) {
    setTimeout(() => {
      try { context.createMediaElementSource(element).connect(output); } catch (e) { host.log(NAME, 'route failed: ' + e); }
      element.addEventListener('playing', () => { active = element; host.changed(NAME); });
      element.addEventListener('ended', () => { if (element === active) finish(); });
    }, 0);
  }
  return element;
};

function finish() {
  if (finished || parked || !songId) return;
  finished = true;
  host.ended(NAME);
}

function loading() {
  const S = MusicKit.PlaybackStates;
  return [S.loading, S.waiting, S.stalled, S.seeking].includes(mk.playbackState);
}

function waitForPlaying() {
  return new Promise((resolve, reject) => {
    const S = MusicKit.PlaybackStates;
    const done = (error) => { clearTimeout(timer); mk.removeEventListener('playbackStateDidChange', watch); error ? reject(error) : resolve(); };
    const watch = () => { if (mk.playbackState === S.playing) done(); };
    const timer = setTimeout(() => done(new Error('Apple Music took too long to start.')), 20000);
    mk.addEventListener('playbackStateDidChange', watch);
    watch();
  });
}

async function start(position) {
  await context.resume();
  await mk.play();
  if (position > 0) await mk.seekToTime(position);
}

window.deck = {
  async boot(developerToken, bitrate) {
    await new Promise((resolve, reject) => {
      const script = createElement('script');
      script.src = 'https://js-cdn.music.apple.com/musickit/v3/musickit.js';
      script.onload = resolve;
      script.onerror = () => reject(Object.assign(new Error('Could not load Apple Music.'), { errorCode: 'NETWORK_ERROR' }));
      document.head.appendChild(script);
    });
    mk = await MusicKit.configure({ developerToken, app: { name: 'Orchard', build: '1' } });
    this.setBitrate(bitrate);
    const S = MusicKit.PlaybackStates;
    mk.addEventListener('playbackStateDidChange', () => {
      if (mk.playbackState === S.ended || mk.playbackState === S.completed) finish();
      host.changed(NAME);
    });
    mk.addEventListener('playbackDurationDidChange', () => host.changed(NAME));
    mk.addEventListener('mediaPlaybackError', (e) => host.failed(NAME, e));
    mk.addEventListener('drmUnsupported', () => host.failed(NAME, { errorCode: 'DRM_UNSUPPORTED' }));
    return mk.isAuthorized;
  },
  setBitrate(bitrate) {
    mk.bitrate = bitrate === 'standard' ? MusicKit.PlaybackBitrate.STANDARD : MusicKit.PlaybackBitrate.HIGH;
  },
  setLevel(value) {
    volume.gain.setTargetAtTime(value, context.currentTime, 0.01);
  },
  // Equal-power ramp to `target`: sine in, cosine out, so the overlap holds its loudness.
  fade(target, seconds) {
    const from = output.gain.value;
    const curve = new Float32Array(64);
    for (let i = 0; i < curve.length; i++) {
      const t = i / (curve.length - 1);
      curve[i] = target > from ? from + (target - from) * Math.sin(t * Math.PI / 2)
                               : target + (from - target) * Math.cos(t * Math.PI / 2);
    }
    output.gain.cancelScheduledValues(context.currentTime);
    output.gain.setValueCurveAtTime(curve, context.currentTime, Math.max(0.01, seconds));
  },
  async load(id, position, play) {
    songId = id;
    finished = false;
    parked = false;
    setFade(1);
    await mk.setQueue({ song: id });
    pendingSeek = play ? -1 : position;
    if (play) await start(position);
  },
  // Buffers `id` paused at its start, silent, so play() later starts at once.
  async park(id) {
    songId = id;
    finished = false;
    parked = true;
    setFade(0);
    await mk.setQueue({ song: id });
    await start(0);
    await waitForPlaying();
    mk.pause();
    await mk.seekToTime(0);
  },
  // `fadeIn` seconds ramps a parked song up; 0 starts it at full level.
  async play(fadeIn = 0) {
    const wasParked = parked;
    parked = false;
    if (wasParked && fadeIn > 0) this.fade(1, fadeIn);
    else setFade(1);
    const position = pendingSeek;
    pendingSeek = -1;
    await start(Math.max(0, position));
  },
  pause() { if (mk) mk.pause(); },
  async seek(position) {
    finished = false;
    if (pendingSeek >= 0) pendingSeek = position;
    else await mk.seekToTime(position);
  },
  async stop() {
    songId = '';
    parked = false;
    pendingSeek = -1;
    if (mk && mk.playbackState !== MusicKit.PlaybackStates.none) await mk.stop();
  },
  get id() { return songId; },
  get parked() { return parked; },
  // Seconds left in the playing song by the media element's own clock; -1 when not playing.
  remaining() {
    const element = playingElement();
    if (!element || parked) return -1;
    const duration = Number.isFinite(element.duration) && element.duration > 0 ? element.duration : mk.currentPlaybackDuration;
    return duration > 0 ? Math.max(0, duration - element.currentTime) : -1;
  },
  state() {
    const S = MusicKit.PlaybackStates;
    const element = playingElement();
    const position = element ? element.currentTime : mk.currentPlaybackTime;
    return {
      id: songId,
      playing: mk.playbackState === S.playing || (loading() && pendingSeek < 0 && !!active && !active.paused),
      loading: loading(),
      position: pendingSeek >= 0 ? pendingSeek : position || 0,
      duration: mk.currentPlaybackDuration || 0,
    };
  },
};
host.attached(NAME);
</script>
</template>
<script>
'use strict';
// Host protocol: the app calls orchardPlayer.command({type, ...}); events go to
// window.orchardAppleMusic.postMessage(json). Decrypted audio never leaves this page.
const outbox = [];
function post(message) {
  const text = JSON.stringify(message);
  if (window.orchardAppleMusic) window.orchardAppleMusic.postMessage(text);
  else outbox.push(text);
}
window.addEventListener('orchardbridge', () => {
  while (outbox.length && window.orchardAppleMusic) window.orchardAppleMusic.postMessage(outbox.shift());
});

const decks = {};
let current = 'a';
let spare = 'b';
let developerToken = '';
let bitrate = 'high';
let volume = 1;
let ticker = 0;
// MusicKit passes through several states while a song loads; report once it settles.
let loadingSong = false;
// Crossfade length into the prepared song; 0 starts it gaplessly when the current one ends.
let fadeSeconds = 0;
let fadeTimer = 0;
// {outgoing, incoming, timer} while both decks play.
let fading = null;

function errorCode(error) {
  const code = String((error && (error.errorCode || error.name)) || '');
  if (/UNAUTHORIZED|AUTHORIZATION|USER_TOKEN|TOKEN_EXPIRED/i.test(code)) return 'unauthorized';
  if (/SUBSCRIPTION/i.test(code)) return 'subscription';
  if (/CONTENT_(RESTRICTED|UNAVAILABLE|UNSUPPORTED)|NOT_FOUND|UNSUPPORTED_ERROR/i.test(code)) return 'unavailable';
  if (/DRM|KEY_SYSTEM|MEDIA_KEY|WIDEVINE/i.test(code)) return 'drm';
  if (/NETWORK/i.test(code)) return 'network';
  return 'playback';
}

function report(error, id) {
  const code = errorCode(error);
  post({ type: 'error', id: id || '', code, detail: String((error && (error.message || error.description || error.errorCode)) || error || '') });
}

function sendState() {
  const deck = decks[current];
  if (loadingSong || !deck || !deck.api || !deck.api.id) return;
  post({ type: 'state', ...deck.api.state() });
}

// Starts the crossfade once the playing song is within fadeSeconds of its end.
function scheduleFade() {
  clearTimeout(fadeTimer);
  fadeTimer = 0;
  const now = decks[current];
  const next = decks[spare];
  if (fading || fadeSeconds <= 0 || !now || !now.api || !next || !next.api || !next.ready || !next.api.parked) return;
  const remaining = now.api.remaining();
  if (remaining < 0) return;
  if (remaining <= fadeSeconds + 0.02) startFade(remaining);
  else fadeTimer = setTimeout(scheduleFade, Math.min(5000, (remaining - fadeSeconds) * 1000));
}

function startFade(remaining) {
  const seconds = Math.max(0.05, Math.min(fadeSeconds, remaining));
  fading = { outgoing: current, incoming: spare, timer: setTimeout(completeFade, seconds * 1000 + 50) };
  const incoming = decks[spare].api;
  incoming.play(seconds).catch((e) => report(e, incoming.id));
  decks[current].api.fade(0, seconds);
}

// The incoming deck becomes current; the app hears about it as a gapless advance.
function completeFade() {
  if (!fading) return;
  const { outgoing, incoming, timer } = fading;
  fading = null;
  clearTimeout(timer);
  current = incoming;
  spare = outgoing;
  decks[incoming].ready = false;
  decks[outgoing].ready = false;
  decks[incoming].api.fade(1, 0.02);
  decks[outgoing].api.stop().catch(() => {});
  post({ type: 'advanced', id: decks[incoming].api.id });
  sendState();
  tick();
}

function tick() {
  const deck = decks[current];
  const playing = deck && deck.api && deck.api.state().playing;
  if (playing && !ticker) ticker = setInterval(sendState, 500);
  if (!playing && ticker) { clearInterval(ticker); ticker = 0; }
}

window.orchardDeckHost = {
  attached(name) { decks[name].attach(); },
  changed(name) {
    if (name !== current) return;
    sendState();
    tick();
    scheduleFade();
  },
  ended(name) {
    if (name !== current) return;
    if (fading) {
      completeFade();
      return;
    }
    const next = decks[spare];
    const id = decks[name].api.id;
    // Gapless: the spare deck already holds the next song, paused at its start.
    if (next && next.api && next.api.parked && next.ready) {
      [current, spare] = [spare, current];
      decks[current].ready = false;
      next.api.play().catch((e) => report(e, next.api.id));
      post({ type: 'advanced', id: next.api.id });
      decks[spare].api.stop().catch(() => {});
      sendState();
      return;
    }
    post({ type: 'ended', id });
    tick();
  },
  failed(name, error) {
    if (name === current) report(error, decks[name].api.id);
    else if (decks[name]) decks[name].ready = false;
  },
  log(name, text) { console.warn('[' + name + '] ' + text); },
};

function deck(name) {
  if (decks[name]) return decks[name].booted;
  const entry = { api: null, ready: false };
  decks[name] = entry;
  entry.booted = new Promise((resolve, reject) => {
    entry.attach = () => {
      entry.api = frame.contentWindow.deck;
      entry.api.boot(developerToken, bitrate).then((authorized) => {
        entry.api.setLevel(volume);
        resolve(authorized);
      }, reject);
    };
    const frame = document.createElement('iframe');
    frame.name = name;
    frame.hidden = true;
    frame.allow = 'encrypted-media; autoplay';
    frame.srcdoc = document.getElementById('deck').innerHTML;
    document.body.appendChild(frame);
  });
  entry.booted.catch(() => { delete decks[name]; });
  return entry.booted;
}

async function handle(command) {
  const active = () => decks[current] && decks[current].api;
  switch (command.type) {
    case 'configure': {
      developerToken = String(command.developerToken || '');
      bitrate = command.bitrate === 'standard' ? 'standard' : 'high';
      const authorized = await deck(current);
      post({ type: 'ready', authorized });
      return;
    }
    case 'load': {
      await deck(current);
      const id = String(command.id || '');
      const next = decks[spare];
      const position = Math.max(0, Number(command.position) || 0);
      loadingSong = true;
      try {
        if (next && next.api && next.ready && next.api.id === id && command.play && position === 0) {
          [current, spare] = [spare, current];
          await decks[spare].api.stop();
          await next.api.play();
        } else {
          await active().load(id, position, !!command.play);
        }
      } finally {
        loadingSong = false;
      }
      sendState();
      tick();
      return;
    }
    case 'prepare': {
      const id = String(command.id || '');
      const next = decks[spare];
      fadeSeconds = id ? Math.max(0, Number(command.fade) || 0) : 0;
      if (!id) {
        if (next && next.api) { next.ready = false; await next.api.stop(); }
        return;
      }
      if (next && next.api && next.api.id === id && next.ready) {
        scheduleFade();
        return;
      }
      await deck(spare);
      decks[spare].ready = false;
      await decks[spare].api.park(id);
      if (decks[spare].api.id === id) decks[spare].ready = true;
      scheduleFade();
      return;
    }
    case 'play': if (active()) await active().play(); break;
    case 'pause': if (active()) active().pause(); break;
    case 'seek': if (active()) await active().seek(Math.max(0, Number(command.position) || 0)); break;
    case 'stop':
      for (const name of Object.keys(decks)) {
        if (!decks[name].api) continue;
        decks[name].ready = false;
        await decks[name].api.stop();
      }
      break;
    case 'bitrate':
      bitrate = command.value === 'standard' ? 'standard' : 'high';
      for (const name of Object.keys(decks)) if (decks[name].api) decks[name].api.setBitrate(bitrate);
      return;
    default:
      return;
  }
  sendState();
  tick();
  scheduleFade();
}

// Commands run in order; volume skips the line so a drag stays smooth while a song loads.
let queue = Promise.resolve();
window.orchardPlayer = {
  command(command) {
    if (!command || typeof command !== 'object') return;
    if (command.type === 'volume') {
      volume = Math.min(1, Math.max(0, Number(command.value) || 0));
      for (const name of Object.keys(decks)) if (decks[name].api) decks[name].api.setLevel(volume);
      return;
    }
    // Any transport command settles a running crossfade onto the incoming song first.
    if (fading && command.type !== 'bitrate') completeFade();
    queue = queue.then(() => handle(command)).catch((error) => {
      if (command.type === 'prepare') return;
      report(error, command.type === 'load' ? command.id : (decks[current] && decks[current].api && decks[current].api.id));
    });
  },
};
</script>
</body>
</html>
