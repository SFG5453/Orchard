[package]
name = "orchard-linux"
version = "5.0.0-beta.6"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
discord-rich-presence = "1.1.0"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-resampling"] }
orchard-transition-core = { path = "../native-audio-rust/core" }
playwire = "1.0.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
webkit2gtk = "=2.0.2"

[profile.release]
lto = "thin"
strip = true
