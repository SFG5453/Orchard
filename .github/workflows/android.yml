name: Android CI

on:
  push:
    paths:
      - 'mobile/android/**'
      - 'mobile/tools/generate-planner-fixtures.mjs'
      - 'core/js/src/audio/crossfade/**'
      - 'core/js/shared/**'
      - 'core/native/**'
      - 'crates/**'
      - 'providers/youtube/**'
      - 'providers/qobuz/**'
      - 'third_party/**'
      - 'vendor/litert/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitmodules'
      - '.github/workflows/android.yml'

  pull_request:
    paths:
      - 'mobile/android/**'
      - 'mobile/tools/generate-planner-fixtures.mjs'
      - 'core/js/src/audio/crossfade/**'
      - 'core/js/shared/**'
      - 'core/native/**'
      - 'crates/**'
      - 'providers/youtube/**'
      - 'providers/qobuz/**'
      - 'third_party/**'
      - 'vendor/litert/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitmodules'
      - '.github/workflows/android.yml'

jobs:
  test:
    name: Run Gradle Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js for provider builds
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: providers/youtube/package-lock.json

      - name: Install provider build dependencies
        run: npm ci --prefix providers/youtube

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Grant execute permission for gradlew
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Run Gradle Unit Tests
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest
