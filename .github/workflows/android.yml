name: Android CI

on:
  push:
    paths:
      - 'mobile/android/**'
      - 'mobile/tools/transition-planner/**'
      - 'src/audio/crossfade/**'
      - 'shared/trackAnalysis.js'
      - 'scripts/*mobile*planner*.mjs'
      - 'test/fixtures/mobileTransitionPlanner.js'
      - 'package*.json'

  pull_request:
    paths:
      - 'mobile/android/**'
      - 'mobile/tools/transition-planner/**'
      - 'src/audio/crossfade/**'
      - 'shared/trackAnalysis.js'
      - 'scripts/*mobile*planner*.mjs'
      - 'test/fixtures/mobileTransitionPlanner.js'
      - 'package*.json'

jobs:
  test:
    name: Run Gradle Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js for the shared transition planner
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install planner build dependencies
        run: npm ci --ignore-scripts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Grant execute permission for gradlew
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Run Gradle Unit Tests
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest
