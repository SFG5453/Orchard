# Builds an installable APK for a chosen branch and leaves it as a workflow
# artifact. Nothing is tagged, released, or uploaded to R2, and the updater
# manifest is untouched, so a test build can never be mistaken for a release by
# an app already in the field.
#
# Testers download it without a GitHub account through nightly.link:
#   https://nightly.link/SFG5453/Orchard/workflows/android-canary-build/<branch>/Orchard-Canary-APK.zip
#
# The canary build type installs as its own app beside a tester's real Orchard
# and has its updater compiled out, so it can never replace or nag the install
# people actually use.
name: Android Canary Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Canary APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Canary keeps release signing and minification so it exercises the same R8
      # output the published APK does; a debug build would miss that class of bug.
      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orchard-release.jks"
          chmod 600 "$RUNNER_TEMP/orchard-release.jks"

      - name: Build canary APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/orchard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleCanary

      - name: Collect the APK
        id: collect
        working-directory: mobile/android
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/canary/app-canary.apk"
          test -f "$source_apk"

          version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle)"
          test -n "$version"
          short_sha="$(git rev-parse --short HEAD)"
          # The branch and commit live in the filename because these builds are
          # handed out one at a time and come back described only as "the APK".
          safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr -c 'A-Za-z0-9._-' '-')"
          apk_name="Orchard-Canary-${version}-${safe_ref}-${short_sha}.apk"

          mkdir -p "$RUNNER_TEMP/apk"
          cp "$source_apk" "$RUNNER_TEMP/apk/$apk_name"
          ( cd "$RUNNER_TEMP/apk" && sha256sum "$apk_name" > "$apk_name.sha256" )
          cat "$RUNNER_TEMP/apk/$apk_name.sha256"

      # The artifact name is fixed so the nightly.link URL above stays valid; the
      # varying detail is in the APK filename inside the zip.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Orchard-Canary-APK
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 90
