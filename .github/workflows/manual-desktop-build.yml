name: Build and publish desktop release

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and upload artifacts without publishing to R2
        required: true
        default: false
        type: boolean
      platforms:
        description: Platforms to build; publishing needs all
        required: true
        default: all
        type: choice
        options: [all, linux, arch, windows, macos, macos-arm64, macos-x86_64]
      channel:
        description: Signed update channel to publish
        required: true
        default: canary
        type: choice
        options: [canary, stable]

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64 app and bootstrapper
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CC: clang
      CXX: clang++
      CCACHE_DIR: ${{ github.workspace }}/build-cache/linux-ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      LDFLAGS: -fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore Apple Music logo
        env:
          APPLE_MUSIC_LOGO_PNG_BASE64: ${{ secrets.APPLE_MUSIC_LOGO_PNG_BASE64 }}
        run: python scripts/restore-apple-music-logo.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore Linux compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orchard-linux-clang-mold-qt6120-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            orchard-linux-clang-mold-qt6120-v1-
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config clang mold ccache libclang-dev \
            libsecret-1-dev libwebkit2gtk-4.1-dev glib-networking libfuse2t64 libgl1-mesa-dev libvulkan-dev ffmpeg \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-shm0 \
            libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbcommon-x11-0
          python -m pip install 'meson>=1.12,<2' cryptography 'git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          rustup update stable
      - name: Prepare Linux compiler cache
        id: ccache-setup
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          clang --version | head -1
          mold --version
          ccache --version | head -1
      - name: Install Qt 6.12.0
        shell: bash
        run: |
          python -m aqt install-qt linux desktop 6.12.0 linux_gcc_64 -m qtmultimedia qtshadertools qtwebsockets -O "$RUNNER_TEMP/Qt"
          qt_config="$(find "$RUNNER_TEMP/Qt/6.12.0" -path '*/lib/cmake/Qt6/Qt6Config.cmake' -type f -print -quit)"
          test -n "$qt_config"
          qt_root="${qt_config%/lib/cmake/Qt6/Qt6Config.cmake}"
          # qml caches have an rcc directory; only an executable gets the job.
          rcc="$(find "$qt_root" -type f -name rcc -perm /111 -print -quit)"
          qsb="$(find "$qt_root" -type f -name qsb -perm /111 -print -quit)"
          test -x "$rcc" && test -x "$qsb"
          echo "QT_ROOT=$qt_root" >> "$GITHUB_ENV"
          echo "QT_RCC=$rcc" >> "$GITHUB_ENV"
          echo "QT_QSB=$qsb" >> "$GITHUB_ENV"
          echo "$qt_root/bin" >> "$GITHUB_PATH"
          echo "$(dirname "$rcc")" >> "$GITHUB_PATH"
          echo "$(dirname "$qsb")" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$qt_root/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$qt_root" >> "$GITHUB_ENV"
          dependencies="$(LD_LIBRARY_PATH="$qt_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ldd "$qt_root/plugins/platforms/libqxcb.so")"
          echo "$dependencies"
          if grep -q 'not found' <<< "$dependencies"; then exit 1; fi
      - name: Build Orchard
        run: |
          npm ci --prefix providers/youtube
          meson setup build/desktop --native-file scripts/release/linux-clang-mold.ini --buildtype release -Dtests=false -Dhost_rcc="$QT_RCC" -Dhost_qsb="$QT_QSB"
          meson compile -C build/desktop
      - name: Check Linux QML startup
        run: |
          meson compile -C build/desktop orchard_qml_startup_test
          QT_QPA_PLATFORM=offscreen ./build/desktop/orchard_qml_startup_test
      - name: Build and test bootstrapper
        run: |
          meson setup build/bootstrapper bootstrapper --native-file scripts/release/linux-clang-mold.ini --buildtype release
          meson compile -C build/bootstrapper
          meson test -C build/bootstrapper --print-errorlogs
      - name: Package Linux release
        run: |
          bash scripts/package-linux-appimage.sh build/desktop "$QT_ROOT" "$RUNNER_TEMP/orchard-linux"
          cp build/bootstrapper/orchard-bootstrapper "$RUNNER_TEMP/orchard-linux/orchard-bootstrapper"
          tar -C "$RUNNER_TEMP/orchard-linux" -cf "$RUNNER_TEMP/orchard-linux-publish.tar" AppDir Orchard-Linux-x86_64.AppImage orchard-bootstrapper
      - uses: actions/upload-artifact@v4
        with:
          name: orchard-linux-publish
          path: ${{ runner.temp }}/orchard-linux-publish.tar
          if-no-files-found: error
          retention-days: 14
      - name: Linux compiler cache stats
        if: always() && steps.ccache-setup.outcome == 'success'
        run: ccache --show-stats
      - name: Save Linux compiler cache
        if: always() && steps.ccache-setup.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orchard-linux-clang-mold-qt6120-v1-${{ github.run_id }}-${{ github.run_attempt }}

  arch:
    name: Arch Linux x86_64 package
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'arch' }}
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/build-cache/arch-ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - name: Install packaging tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo python ccache
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Arch compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orchard-arch-clang-mold-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            orchard-arch-clang-mold-v1-
      - name: Restore Apple Music logo
        env:
          APPLE_MUSIC_LOGO_PNG_BASE64: ${{ secrets.APPLE_MUSIC_LOGO_PNG_BASE64 }}
        run: python scripts/restore-apple-music-logo.py
      - name: Build Arch package
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/arch-packages" "$CCACHE_DIR"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'ccache --zero-stats && cd "$1/packaging/arch" && ORCHARD_MESON_NATIVE_FILE="$1/scripts/release/linux-clang-mold.ini" PKGDEST="$1/arch-packages" makepkg -sf --noconfirm' _ "$GITHUB_WORKSPACE"
      - name: Check package dependencies
        shell: bash
        run: |
          package=$(find "$GITHUB_WORKSPACE/arch-packages" -maxdepth 1 -name 'orchard-git-*.pkg.tar.zst' ! -name 'orchard-git-debug-*' -print -quit)
          test -n "$package"
          mkdir -p "$RUNNER_TEMP/orchard-arch-check"
          bsdtar -xf "$package" -C "$RUNNER_TEMP/orchard-arch-check"
          appdir="$RUNNER_TEMP/orchard-arch-check/opt/orchard"
          for binary in orchard orchard-auth-helper orchard-widevine-host orchard-adaptive-mix; do
            output="$(LD_LIBRARY_PATH="$appdir" ldd "$appdir/$binary")"
            echo "$output"
            if [[ "$output" == *'not found'* ]]; then exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: orchard-arch-x86_64
          path: ${{ github.workspace }}/arch-packages/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
      - name: Arch compiler cache stats
        if: always()
        run: su builder -c 'ccache --show-stats'
      - name: Save Arch compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orchard-arch-clang-mold-v1-${{ github.run_id }}-${{ github.run_attempt }}

  windows:
    name: Windows x86_64 app and bootstrapper
    if: ${{ inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 360
    env:
      CC: cl
      CXX: cl
      CCACHE_DIR: ${{ github.workspace }}/build-cache/windows-msvc-ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore Apple Music logo
        env:
          APPLE_MUSIC_LOGO_PNG_BASE64: ${{ secrets.APPLE_MUSIC_LOGO_PNG_BASE64 }}
        run: python scripts/restore-apple-music-logo.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - uses: msys2/setup-msys2@v2
        id: ffmpeg-msys2
        with:
          msystem: MINGW64
          install: >-
            make nasm mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib
      - name: Select FFmpeg build shell
        shell: pwsh
        run: |
          "ORCHARD_FFMPEG_BASH=${{ steps.ffmpeg-msys2.outputs.msys2-location }}/usr/bin/bash.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Restore Windows compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orchard-windows-msvc-qt6120-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            orchard-windows-msvc-qt6120-v1-
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install 'meson>=1.12,<2' ninja 'cryptography>=45,<51' 'git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup update stable
          if (!(Get-Command ccache.exe -ErrorAction SilentlyContinue)) { choco install ccache --yes --no-progress }
          if (!(Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Prepare Windows installer compiler
        shell: pwsh
        run: |
          $nsisCandidates = @(
            (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
            "$env:ProgramFiles\NSIS\makensis.exe"
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          )
          $nsis = $nsisCandidates | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if (!$nsis) { throw "makensis.exe is missing after installation; searched: $($nsisCandidates -join ', ')" }
          Write-Host "Using NSIS compiler: $nsis"
          & $nsis /VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NSIS_EXE=$nsis" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test Windows packaging
        shell: pwsh
        run: python -m unittest discover -s scripts -p 'test_windows_*.py' -v
      - name: Prepare Windows compiler cache
        id: ccache-setup
        shell: pwsh
        run: |
          $ccache = (Get-Command ccache.exe -ErrorAction SilentlyContinue).Source
          if (!$ccache) { $ccache = 'C:\ProgramData\chocolatey\bin\ccache.exe' }
          if (!(Test-Path $ccache)) { throw 'ccache.exe is missing after installation' }
          (Split-Path $ccache) | Out-File -FilePath $env:GITHUB_PATH -Append
          New-Item -ItemType Directory -Force $env:CCACHE_DIR | Out-Null
          & $ccache --zero-stats
          & $ccache --version
      - name: Install Qt 6.12.0
        shell: pwsh
        run: |
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 -m qtmultimedia qtshadertools qtserialport qtwebsockets -O "$env:RUNNER_TEMP\Qt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $qt = "$env:RUNNER_TEMP\Qt\6.12.0\msvc2022_64"
          if (!(Test-Path "$qt\lib\cmake\Qt6\Qt6Config.cmake")) { throw "Qt installation missing at $qt" }
          $rcc = Get-ChildItem $qt -Filter rcc.exe -File -Recurse | Select-Object -First 1
          $qsb = Get-ChildItem $qt -Filter qsb.exe -File -Recurse | Select-Object -First 1
          if (!$rcc -or !$qsb) { throw 'Qt rcc or qsb tool is missing' }
          "QT_ROOT=$qt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "QT_RCC=$($rcc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "QT_QSB=$($qsb.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$qt" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$qt\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          $rcc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
          $qsb.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build Orchard
        shell: pwsh
        run: |
          npm ci --prefix providers/youtube
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          meson setup build/desktop --native-file scripts/release/windows-msvc-ccache.ini --buildtype release -Dtests=false "-Dhost_rcc=$env:QT_RCC" "-Dhost_qsb=$env:QT_QSB"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          meson compile -C build/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Windows QML startup
        shell: pwsh
        run: |
          meson compile -C build/desktop orchard_qml_startup_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import subprocess; subprocess.run(['build/desktop/orchard_qml_startup_test.exe', '-platform', 'offscreen'], check=True, timeout=60)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build bootstrapper
        shell: pwsh
        run: |
          meson setup build/bootstrapper bootstrapper --native-file scripts/release/windows-msvc-ccache.ini --buildtype release -Dtests=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          meson compile -C build/bootstrapper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows release
        shell: pwsh
        run: |
          $output = "$env:RUNNER_TEMP\orchard-windows"
          New-Item -ItemType Directory -Force $output | Out-Null
          python scripts/package-windows-native.py --build-dir build/desktop --qt-root "$env:QT_ROOT" --output "$output\Orchard-Windows-x86_64.7z"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/bootstrapper/orchard-bootstrapper.exe "$output\orchard-bootstrapper.exe"
      - name: Build Windows setup with makensis
        shell: pwsh
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          $output = "$env:RUNNER_TEMP\orchard-windows"
          $appVersion = (meson introspect --projectinfo build/desktop | ConvertFrom-Json).version
          $versionParts = [regex]::Match($appVersion, '^(\d+)\.(\d+)\.(\d+)(?:-canary\.(\d+))?$')
          if (!$versionParts.Success) { throw "Unsupported setup version: $appVersion" }
          $revision = if ($versionParts.Groups[4].Success) { $versionParts.Groups[4].Value } else { '0' }
          $fileVersion = '{0}.{1}.{2}.{3}' -f $versionParts.Groups[1].Value, $versionParts.Groups[2].Value, $versionParts.Groups[3].Value, $revision
          & $env:NSIS_EXE "-DBOOTSTRAPPER_EXE=$output\orchard-bootstrapper.exe" "-DOUTPUT_FILE=$output\OrchardSetup.exe" "-DORCHARD_VERSION=$appVersion" "-DORCHARD_FILE_VERSION=$fileVersion" "-DDEFAULT_CHANNEL=$env:RELEASE_CHANNEL" bootstrapper/OrchardSetup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$output\OrchardSetup.exe")) { throw 'NSIS setup was not created' }
      - uses: actions/upload-artifact@v4
        with:
          name: orchard-windows-publish
          path: |
            ${{ runner.temp }}/orchard-windows/Orchard-Windows-x86_64.7z
            ${{ runner.temp }}/orchard-windows/orchard-bootstrapper.exe
            ${{ runner.temp }}/orchard-windows/OrchardSetup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Windows compiler cache stats
        if: always() && steps.ccache-setup.outcome == 'success'
        shell: pwsh
        run: ccache --show-stats
      - name: Save Windows compiler cache
        if: always() && steps.ccache-setup.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orchard-windows-msvc-qt6120-v1-${{ github.run_id }}-${{ github.run_attempt }}

  macos:
    name: macOS ${{ matrix.arch }} app
    if: ${{ inputs.platforms == 'all' || startsWith(inputs.platforms, 'macos') }}
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.platforms == 'macos-arm64' && '["arm64"]' || inputs.platforms == 'macos-x86_64' && '["x86_64"]' || '["arm64","x86_64"]') }}
    env:
      ORT_VERSION: v1.31.0
      CCACHE_DIR: ${{ github.workspace }}/build-cache/macos-${{ matrix.arch }}-ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CC: ccache clang
      CXX: ccache clang++
      OBJC: ccache clang
      OBJCXX: ccache clang++
      SIGNING_CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore Apple Music logo
        env:
          APPLE_MUSIC_LOGO_PNG_BASE64: ${{ secrets.APPLE_MUSIC_LOGO_PNG_BASE64 }}
        run: python3 scripts/restore-apple-music-logo.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build tools
        run: |
          brew install ninja ccache
          export GIT_TERMINAL_PROMPT=0
          # GitHub occasionally refuses an anonymous clone; retry before failing.
          for attempt in 1 2 3 4 5; do
            python -m pip install 'meson>=1.12,<2' 'dmgbuild>=1.6,<2' 'git+https://github.com/miurahr/aqtinstall@076e1659807d0b362a3ed684d54c2e9c775eb9c7' && break
            if [[ $attempt == 5 ]]; then exit 1; fi
            sleep $((attempt * 15))
          done
          rustup update stable
          if [[ "${{ matrix.arch }}" == x86_64 ]]; then rustup target add x86_64-apple-darwin; fi
      - name: Restore macOS compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orchard-macos-${{ matrix.arch }}-ccache-qt6120-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            orchard-macos-${{ matrix.arch }}-ccache-qt6120-v1-
      - name: Restore Rust build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            build/desktop/cargo-target
          key: orchard-macos-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            orchard-macos-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}-
            orchard-macos-${{ matrix.arch }}-cargo-
      - name: Prepare macOS compiler cache
        id: ccache-setup
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          ccache --version | head -1
      - name: Install Qt 6.12.0
        run: |
          python -m aqt install-qt mac desktop 6.12.0 clang_64 -m qtmultimedia qtshadertools qtwebsockets -O "$RUNNER_TEMP/Qt"
          qt_root="$RUNNER_TEMP/Qt/6.12.0/macos"
          rcc="$(find "$qt_root" -type f -name rcc -perm +111 -print -quit)"
          qsb="$(find "$qt_root" -type f -name qsb -perm +111 -print -quit)"
          test -x "$rcc" && test -x "$qsb"
          echo "QT_ROOT=$qt_root" >> "$GITHUB_ENV"
          echo "QT_RCC=$rcc" >> "$GITHUB_ENV"
          echo "QT_QSB=$qsb" >> "$GITHUB_ENV"
          echo "$qt_root/bin" >> "$GITHUB_PATH"
          echo "$(dirname "$rcc")" >> "$GITHUB_PATH"
          echo "$(dirname "$qsb")" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$qt_root" >> "$GITHUB_ENV"
      - name: Restore Intel ONNX Runtime
        if: matrix.arch == 'x86_64'
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ort-x86_64
          key: orchard-macos-ort-x86_64-${{ env.ORT_VERSION }}-v1
      # ort-sys ships no x86_64 macOS binaries, so the worker links a source build.
      - name: Build Intel ONNX Runtime
        if: matrix.arch == 'x86_64' && steps.ort-cache.outputs.cache-hit != 'true'
        env:
          CC: clang
          CXX: clang++
          OBJC: clang
          OBJCXX: clang++
        run: |
          git clone --depth 1 --branch "$ORT_VERSION" https://github.com/microsoft/onnxruntime "$RUNNER_TEMP/onnxruntime"
          cd "$RUNNER_TEMP/onnxruntime"
          ./build.sh --config Release --build_shared_lib --parallel --skip_tests --compile_no_warning_as_error \
            --apple_deploy_target 14.4 --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=x86_64
          mkdir -p "$RUNNER_TEMP/ort-x86_64"
          cp -a build/MacOS/Release/libonnxruntime*.dylib "$RUNNER_TEMP/ort-x86_64/"
          lipo -archs "$RUNNER_TEMP/ort-x86_64/libonnxruntime.dylib" | grep -qx x86_64
      - name: Build host qjsc
        if: matrix.arch == 'x86_64'
        run: |
          cmake -S third_party/quickjs -B build-qjsc-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-qjsc-host --target qjsc -j 4
          echo "HOST_QJSC=$PWD/build-qjsc-host/qjsc" >> "$GITHUB_ENV"
          echo "ORT_LIB_LOCATION=$RUNNER_TEMP/ort-x86_64" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
      - name: Import signing certificate
        run: |
          for name in SIGNING_CERT_P12_BASE64 SIGNING_CERT_PASSWORD \
              NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing the secret behind $name. macOS releases are always signed and notarized."
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/orchard-build.keychain-db"
          password="$(uuidgen)"
          echo "$SIGNING_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$SIGNING_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          # Without Apple's intermediate the identity is listed but never valid for codesign.
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          # The .p12 may already carry the intermediate, which makes this import fail.
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          # The identity is read from the keychain so stray whitespace in a secret cannot break it.
          identities="$(security find-identity -v -p codesigning "$keychain")"
          identity="$(sed -n 's/.*"\(Developer ID Application: .*\)".*/\1/p' <<< "$identities" | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "::error::No valid Developer ID Application identity in the signing keychain ($(security find-identity -p codesigning "$keychain" | tail -n 1))."
            exit 1
          fi
          echo "CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Build Orchard
        run: |
          npm ci --prefix providers/youtube
          args=(--buildtype release -Dtests=false -Dmacos_distribution=true
            "-Dmacos_codesign_identity=$CODESIGN_IDENTITY" "-Dhost_rcc=$QT_RCC" "-Dhost_qsb=$QT_QSB")
          if [[ "${{ matrix.arch }}" == x86_64 ]]; then
            # Meson ignores PATH for host tools in cross builds, so name qmake in a second cross file.
            printf "[binaries]\nqmake6 = '%s'\n" "$QT_ROOT/bin/qmake6" > "$RUNNER_TEMP/macos-qt.ini"
            args+=(--cross-file scripts/release/macos-x86_64-cross.ini --cross-file "$RUNNER_TEMP/macos-qt.ini"
              -Dorchard_rust_target=x86_64-apple-darwin "-Dhost_qjsc=$HOST_QJSC")
          fi
          meson setup build/desktop "${args[@]}"
          meson compile -C build/desktop
          app=build/desktop/Orchard.app
          test -d "$app"
          lipo -archs "$app/Contents/MacOS/orchard" | grep -qx '${{ matrix.arch }}'
      - name: Check macOS QML startup
        if: matrix.arch == 'arm64'
        run: |
          meson compile -C build/desktop orchard_qml_startup_test
          # The test binary has no Qt rpath.
          DYLD_FRAMEWORK_PATH="$QT_ROOT/lib" QT_QPA_PLATFORM=offscreen ./build/desktop/orchard_qml_startup_test
      - name: Notarize app
        run: |
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent build/desktop/Orchard.app "$RUNNER_TEMP/Orchard-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Orchard-notarize.zip" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple build/desktop/Orchard.app
          xcrun stapler validate build/desktop/Orchard.app
          spctl --assess --type execute --verbose build/desktop/Orchard.app
      - name: Package macOS disk image
        run: |
          output="$RUNNER_TEMP/orchard-macos"
          dmg="$output/Orchard-macOS-${{ matrix.arch }}.dmg"
          mkdir -p "$output"
          dmgbuild -s packaging/macos/dmg-settings.py -D app=build/desktop/Orchard.app Orchard "$dmg"
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: orchard-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/orchard-macos/Orchard-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 14
      - name: macOS compiler cache stats
        if: always() && steps.ccache-setup.outcome == 'success'
        run: ccache --show-stats
      - name: Save macOS compiler cache
        if: always() && steps.ccache-setup.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: orchard-macos-${{ matrix.arch }}-ccache-qt6120-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save Rust build cache
        if: always() && steps.ccache-setup.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/ort.pyke.io
            build/desktop/cargo-target
          key: orchard-macos-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGNING_KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/notary.p8"

  publish:
    name: Publish signed release to R2
    if: ${{ !inputs.build_only && inputs.platforms == 'all' }}
    needs: [linux, windows, arch]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: orchard-r2-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: orchard-linux-publish
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: orchard-windows-publish
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: orchard-arch-x86_64
          path: dist/arch
      - name: Unpack both platform trees
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          tar -C dist/linux -xf dist/linux/orchard-linux-publish.tar
          mkdir -p dist/windows/staged
          7z x -y dist/windows/Orchard-Windows-x86_64.7z -odist/windows/staged
          test -x dist/linux/orchard-bootstrapper
          test -f dist/windows/orchard-bootstrapper.exe
          test -f dist/windows/OrchardSetup.exe
          test -f dist/windows/staged/Orchard/orchard.exe
      - name: Publish objects, manifests, installers, then channel
        env:
          ORCHARD_RELEASE_PRIVATE_KEY: ${{ secrets.ORCHARD_RELEASE_PRIVATE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          python -m pip install 'cryptography>=45,<51' 'boto3>=1.40,<2'
          mapfile -t arch_packages < <(find dist/arch -maxdepth 1 -name 'orchard-git-*.pkg.tar.zst' ! -name 'orchard-git-debug-*' -print)
          if [[ ${#arch_packages[@]} -ne 1 ]]; then
            echo "Expected one Arch package, found ${#arch_packages[@]}" >&2
            exit 1
          fi
          python scripts/release/publish_r2.py \
            --channel "$RELEASE_CHANNEL" \
            --linux-tree dist/linux/AppDir \
            --windows-tree dist/windows/staged/Orchard \
            --linux-appimage dist/linux/Orchard-Linux-x86_64.AppImage \
            --arch-package "${arch_packages[0]}" \
            --windows-archive dist/windows/Orchard-Windows-x86_64.7z \
            --linux-bootstrapper dist/linux/orchard-bootstrapper \
            --windows-bootstrapper dist/windows/orchard-bootstrapper.exe \
            --windows-setup dist/windows/OrchardSetup.exe
