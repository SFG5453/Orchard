name: Android Release

# Only a v<versionName>-mobile tag starts this workflow.
on:
  push:
    tags: ['v*-mobile']

concurrency:
  group: android-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Match tag to versionName
        id: check
        run: |
          set -euo pipefail
          version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" mobile/android/app/build.gradle)"
          test -n "$version"
          if [[ "$GITHUB_REF_NAME" != "v${version}-mobile" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version (expected v${version}-mobile)." >&2
            exit 1
          fi
          # Only GitHub prereleases are published; stable versions are not handled here.
          if [[ "$version" != *-* ]]; then
            echo "Version $version is not a beta; this workflow only publishes prereleases." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test APK
    needs: verify-tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js for provider builds
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: providers/youtube/package-lock.json

      - name: Install provider build dependencies
        run: npm ci --prefix providers/youtube

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Gradle unit tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orchard-release.jks"
          chmod 600 "$RUNNER_TEMP/orchard-release.jks"

      # The Apple Music logo is kept out of Git; builds without the secret omit it.
      - name: Restore Apple Music logo
        env:
          APPLE_MUSIC_LOGO_PNG_BASE64: ${{ secrets.APPLE_MUSIC_LOGO_PNG_BASE64 }}
          APPLE_MUSIC_MARK_XML_BASE64: ${{ secrets.APPLE_MUSIC_MARK_XML_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$APPLE_MUSIC_LOGO_PNG_BASE64" || -z "$APPLE_MUSIC_MARK_XML_BASE64" ]]; then
            echo "::warning::APPLE_MUSIC_LOGO_PNG_BASE64 or APPLE_MUSIC_MARK_XML_BASE64 is not set; building without the Apple Music logo."
            exit 0
          fi
          res_dir=mobile/android/local/apple-music/res
          mkdir -p "$res_dir/drawable-nodpi" "$res_dir/drawable"
          printf '%s' "$APPLE_MUSIC_LOGO_PNG_BASE64" | base64 --decode > "$res_dir/drawable-nodpi/apple_music_logo.png"
          printf '%s' "$APPLE_MUSIC_MARK_XML_BASE64" | base64 --decode > "$res_dir/drawable/apple_music_mark.xml"
          file "$res_dir/drawable-nodpi/apple_music_logo.png" | grep -q 'PNG image data'
          grep -q '<vector' "$res_dir/drawable/apple_music_mark.xml"

      # Apple's ShazamKit SDK is too large for a secret; fetch it from private R2 and pin its hash.
      - name: Restore ShazamKit SDK
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SHAZAM_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SHAZAM_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          SHAZAM_R2_ENDPOINT: ${{ secrets.SHAZAM_R2_ENDPOINT }}
          SHAZAM_AAR_OBJECT: s3://applethings/shazamkit-android-release.aar
          SHAZAM_AAR_SHA256: e85310c6737f1025a3b0f7852fa73f06840fad5b484ea38ca4912d5d8ad2bc86
        run: |
          set -euo pipefail
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$SHAZAM_R2_ENDPOINT" ]]; then
            echo "::warning::SHAZAM_R2_* secrets are not set; building without Shazam."
            exit 0
          fi
          aar=mobile/android/local/shazam/shazamkit-android-release.aar
          mkdir -p "$(dirname "$aar")"
          aws s3 cp --only-show-errors --endpoint-url "$SHAZAM_R2_ENDPOINT" "$SHAZAM_AAR_OBJECT" "$aar"
          echo "$SHAZAM_AAR_SHA256  $aar" | sha256sum --check --quiet

      - name: Build release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/orchard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Package APK, mapping and update metadata
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version_code="$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p" mobile/android/app/build.gradle)"
          test -n "$version_code"
          apk_name="Orchard-${VERSION}.apk"
          apk_source="mobile/android/app/build/outputs/apk/release/app-release.apk"
          mapping_source="mobile/android/app/build/outputs/mapping/release/mapping.txt"
          test -f "$apk_source"
          test -s "$mapping_source"
          mkdir -p release-assets
          cp "$apk_source" "release-assets/$apk_name"
          cp "$mapping_source" "release-assets/Orchard-${VERSION}.mapping.txt"
          apk_url="https://github.com/${RELEASE_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${apk_name}"
          sha256="$(sha256sum "release-assets/$apk_name" | awk '{print $1}')"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node scripts/generate-android-update-metadata.mjs \
            "$VERSION" "$version_code" "$apk_url" "$sha256" "$published_at" \
            mobile/release-notes.md > release-assets/latest-android.json
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Save release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to GitHub Releases
    needs: [verify-tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release-assets

      - name: Create GitHub prerelease
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Orchard Mobile $VERSION (beta)" \
            --notes-file mobile/release-notes.md \
            --prerelease
