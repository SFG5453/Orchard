name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag or ref to build; optional for build-only runs
        required: false
        type: string
      build_only:
        description: Build and validate artifacts without publishing them
        required: false
        default: false
        type: boolean
      mobile_only:
        description: Build and publish the Android APK alone, skipping every desktop platform
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  ORCHARD_UPDATE_URL: https://downloads.sfg545.dev/orchard/

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      is_beta: ${{ steps.release.outputs.is_beta }}
      mobile_only: ${{ steps.release.outputs.mobile_only }}
      build_android: ${{ steps.release.outputs.build_android }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate tag and package version
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUILD_ONLY: ${{ inputs.build_only || false }}
          MOBILE_ONLY_INPUT: ${{ inputs.mobile_only || false }}
        run: |
          set -euo pipefail

          # A `-mobile` tag suffix ships the Android APK on its own, so a mobile-side fix
          # does not have to drag a whole desktop release behind it. The suffix is not part
          # of any version number: it is stripped here, and what is left has to be a valid
          # release tag on its own terms.
          mobile_only="$MOBILE_ONLY_INPUT"
          version_tag="$RELEASE_TAG"
          case "$RELEASE_TAG" in
            *-mobile)
              mobile_only="true"
              version_tag="${RELEASE_TAG%-mobile}"
              ;;
          esac

          # Desktop and mobile version independently -- desktop is on 4.x while mobile is on
          # 1.x -- so each validates against the file that actually declares its version.
          if [[ "$mobile_only" == "true" ]]; then
            version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" mobile/android/app/build.gradle)"
            version_source="mobile/android/app/build.gradle"
          else
            version="$(node -p "require('./package.json').version")"
            version_source="package.json"
          fi
          test -n "$version"

          if [[ "${BUILD_ONLY:-false}" == "true" ]]; then
            echo "Build-only run: skipping release tag validation."
          else
            case "$version_tag" in
              v[0-9]*) ;;
              *) echo "Release tag must start with v followed by a number." >&2; exit 1 ;;
            esac
            if [[ "$version_tag" != "v$version" ]]; then
              echo "Tag $RELEASE_TAG does not match $version_source version $version." >&2
              exit 1
            fi
            git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "mobile_only=$mobile_only" >> "$GITHUB_OUTPUT"

          android_version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" mobile/android/app/build.gradle)"
          android_version_code="$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p" mobile/android/app/build.gradle)"
          test -n "$android_version"
          test -n "$android_version_code"

          # Compare against the updater manifest because Android can be released
          # independently of desktop tags. If the manifest is unavailable or invalid,
          # build the APK rather than risk omitting a new Android release.
          build_android="true"
          if published_android="$(
            curl --fail --silent --show-error --max-time 15 \
              "${ORCHARD_UPDATE_URL}latest-android.json" |
              node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  try {
                    const metadata = JSON.parse(input);
                    const versionCode = Number(metadata.versionCode);
                    if (!metadata.version || !Number.isInteger(versionCode) || versionCode <= 0) process.exit(1);
                    process.stdout.write(`${metadata.version}\t${versionCode}`);
                  } catch {
                    process.exit(1);
                  }
                });
              '
          )"; then
            IFS=$'\t' read -r published_android_version published_android_version_code <<< "$published_android"
            if [[ "$android_version" == "$published_android_version" && "$android_version_code" == "$published_android_version_code" ]]; then
              build_android="false"
              echo "Android $android_version ($android_version_code) is already published; skipping the APK build."
            else
              echo "Android changed from $published_android_version ($published_android_version_code) to $android_version ($android_version_code); building the APK."
            fi
          else
            echo "Could not read published Android metadata; building the APK."
          fi
          echo "build_android=$build_android" >> "$GITHUB_OUTPUT"

          # Read off the version rather than the tag, so the `-mobile` marker is never
          # mistaken for a prerelease qualifier.
          is_beta="false"
          case "$version" in
            *-*) is_beta="true" ;;
          esac
          echo "is_beta=$is_beta" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.release.outputs.mobile_only != 'true'
        run: npm ci

      - name: Build native Addons
        if: steps.release.outputs.mobile_only != 'true'
        run: npm run build:native

      - name: Run tests
        if: steps.release.outputs.mobile_only != 'true'
        run: npm test

      - name: Set up JDK 17
        if: steps.release.outputs.mobile_only == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run mobile tests
        if: steps.release.outputs.mobile_only == 'true'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          # The debug variant deliberately: any task with "release" in its name trips the
          # signing-environment guard in app/build.gradle, and unit tests need no keystore.
          ./gradlew --no-daemon testDebugUnitTest

  build-linux:
    name: Linux packages
    needs: prepare
    if: needs.prepare.outputs.mobile_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux packaging tools and Flatpak runtimes
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder rpm
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package AppImage, Flatpak, DEB, and RPM
        run: |
          set -euo pipefail
          ./node_modules/.bin/electron-builder \
            --linux AppImage flatpak deb rpm \
            --config electron-builder.config.cjs \
            -c.directories.output=release-linux \
            --publish never

          mkdir -p release-assets
          find release-linux -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.flatpak' -o -name '*.deb' -o -name '*.rpm' -o -name '*.yml' -o -name '*.blockmap' \) \
            -exec cp {} release-assets/ \;
          test "$(find release-assets -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.flatpak' -o -name '*.deb' -o -name '*.rpm' \) | wc -l)" -eq 4
          test -f release-assets/latest-linux.yml
          find release-assets -maxdepth 1 -type f -print

      - name: Save Linux packages and Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build-linux-arm64:
    name: Linux arm64 bundles
    needs: prepare
    if: needs.prepare.outputs.mobile_only != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flatpak packaging tools and runtimes
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify native architecture
        run: |
          set -euo pipefail
          test "$(node -p process.arch)" = arm64
          for addon in \
            native/build/Release/orchard_audio_analysis.node \
            native-media/build/orchard-system-media-linux-arm64.node; do
            file "$addon"
            file "$addon" | grep -Eq 'ARM aarch64|ARM64'
          done

      - name: Package arm64 AppImage and Flatpak
        run: |
          set -euo pipefail
          ./node_modules/.bin/electron-builder \
            --linux AppImage flatpak \
            --arm64 \
            --config electron-builder.config.cjs \
            -c.directories.output=release-linux-arm64 \
            --publish never

          mkdir -p release-assets
          find release-linux-arm64 -maxdepth 1 -type f -name '*-arm64.AppImage' \
            -exec cp {} release-assets/ \;
          find release-linux-arm64 -maxdepth 1 -type f -name '*-aarch64.flatpak' \
            -exec cp {} release-assets/ \;
          cp release-linux-arm64/latest-linux-arm64.yml release-assets/
          test "$(find release-assets -maxdepth 1 -type f -name '*-arm64.AppImage' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*-aarch64.flatpak' | wc -l)" -eq 1
          find release-assets -maxdepth 1 -type f -print

      - name: Save Linux arm64 AppImage and Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-arm64
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build-arch:
    name: Arch Linux package
    needs: prepare
    if: needs.prepare.outputs.mobile_only != 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install Arch build tools
        run: pacman -Syu --noconfirm git electron43 libarchive nodejs npm python rust zstd

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package for Arch Linux
        run: |
          set -euo pipefail
          packaging/linux/arch/build-local.sh
          mkdir -p release-assets
          package="$(find packaging/linux/arch -maxdepth 1 -type f -name 'orchard-*.pkg.tar.*' -print -quit)"
          test -n "$package"
          cp "$package" release-assets/
          find release-assets -maxdepth 1 -type f -print

      - name: Save Arch Linux package
        uses: actions/upload-artifact@v7
        with:
          name: release-arch
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Windows installer
    needs: prepare
    if: needs.prepare.outputs.mobile_only != 'true'
    runs-on: windows-2025
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package NSIS installer
        shell: pwsh
        run: |
          & ./node_modules/.bin/electron-builder.cmd `
            --win nsis `
            --config electron-builder.config.cjs `
            --config.directories.output=release-windows `
            --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installers = @(Get-ChildItem release-windows -File -Filter '*.exe')
          if ($installers.Count -eq 0) { throw 'The Windows installer was not created.' }
          $installers | Copy-Item -Destination release-assets
          Get-ChildItem release-windows -File | Where-Object { $_.Extension -in '.yml', '.blockmap' } | Copy-Item -Destination release-assets
          if (-not (Test-Path release-assets/latest.yml)) { throw 'Windows update metadata was not created.' }
          Get-ChildItem release-assets -File

      - name: Save Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build-windows-arm64:
    name: Windows arm64 installer
    needs: prepare
    if: needs.prepare.outputs.mobile_only != 'true'
    runs-on: windows-11-arm
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify native architecture
        shell: pwsh
        run: |
          if ((node -p process.arch) -ne 'arm64') { throw 'Node.js is not running as arm64.' }
          foreach ($path in @(
            'native/build/Release/orchard_audio_analysis.node',
            'native-media/build/orchard-system-media-win32-arm64.node'
          )) {
            $addon = [IO.File]::ReadAllBytes($path)
            $peOffset = [BitConverter]::ToInt32($addon, 0x3c)
            $machine = [BitConverter]::ToUInt16($addon, $peOffset + 4)
            if ($machine -ne 0xaa64) { throw "$path has PE machine type 0x$($machine.ToString('x4')), expected arm64 (0xaa64)." }
          }

      - name: Package arm64 NSIS installer
        shell: pwsh
        run: |
          & ./node_modules/.bin/electron-builder.cmd `
            --win nsis `
            --arm64 `
            --config electron-builder.config.cjs `
            --config.directories.output=release-windows-arm64 `
            --config.win.artifactName='${productName}-Setup-${version}-arm64.${ext}' `
            --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force release-assets | Out-Null
          $installers = @(Get-ChildItem release-windows-arm64 -File -Filter '*-arm64.exe')
          if ($installers.Count -ne 1) { throw "Expected one Windows arm64 installer, found $($installers.Count)." }
          $installers | Copy-Item -Destination release-assets
          Get-ChildItem release-windows-arm64 -File -Filter '*-arm64.exe.blockmap' | Copy-Item -Destination release-assets
          if (-not (Test-Path release-windows-arm64/latest.yml)) { throw 'Windows arm64 update metadata was not created.' }
          Copy-Item release-windows-arm64/latest.yml release-assets/latest-windows-arm64.yml
          Get-ChildItem release-assets -File

      - name: Save Windows arm64 installer
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-arm64
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: macOS ${{ matrix.arch }} ZIP
    needs: prepare
    if: needs.prepare.outputs.mobile_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            file_arch: arm64
            runner: macos-15
          - arch: x64
            file_arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder's --${{ matrix.arch }} target can differ from the Node
      # process architecture used while loading electron-builder.config.cjs.
      # Keep ONNX inclusion/pruning aligned with the artifact being built.
      ORCHARD_ELECTRON_PLATFORM: darwin
      ORCHARD_ELECTRON_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build application and native audio analyzer
        run: npm run build

      - name: Verify native architecture
        run: |
          for addon in \
            native/build/Release/orchard_audio_analysis.node \
            native-media/build/orchard-system-media-darwin-${{ matrix.arch }}.node; do
            file "$addon"
            file "$addon" | grep -q '${{ matrix.file_arch }}'
          done

      - name: Package unsigned macOS ZIP
        run: |
          set -euo pipefail
          ./node_modules/.bin/electron-builder \
            --mac zip \
            --${{ matrix.arch }} \
            --config electron-builder.config.cjs \
            -c.directories.output=release-macos \
            -c.mac.identity=- \
            --publish never

          mkdir -p release-assets
          find release-macos -maxdepth 1 -type f \( -name '*.zip' -o -name '*.blockmap' \) \
            -exec cp {} release-assets/ \;
          cp release-macos/latest-mac.yml "release-assets/latest-mac-${{ matrix.arch }}.yml"
          test "$(find release-assets -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1
          find release-assets -maxdepth 1 -type f -print

      - name: Save macOS ZIP
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Android APK
    needs: prepare
    if: needs.prepare.outputs.build_android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orchard-release.jks"
          chmod 600 "$RUNNER_TEMP/orchard-release.jks"

      - name: Build Android APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/orchard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Package Android artifact and generate metadata
        working-directory: mobile/android
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          IS_BETA: ${{ needs.prepare.outputs.is_beta }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          # Extract version data from build.gradle
          version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"]/\1/p" app/build.gradle)"
          version_code="$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p" app/build.gradle)"
          
          apk_name="Orchard-${version}.apk"
          apk_source="app/build/outputs/apk/release/app-release.apk"
          
          test -n "$version"
          test -n "$version_code"
          test -f "$apk_source"
          
          mkdir -p ../../release-assets
          cp "$apk_source" "../../release-assets/$apk_name"

          # Stable APKs are served from R2, but beta releases are intentionally not
          # published there. Point beta metadata at the GitHub release asset that is
          # created later in this workflow, so the in-app beta updater can download it.
          apk_url="${ORCHARD_UPDATE_URL}${apk_name}"
          if [[ "$IS_BETA" == "true" ]]; then
            apk_url="https://github.com/${RELEASE_REPOSITORY}/releases/download/${RELEASE_TAG}/${apk_name}"
          fi
          
          sha256="$(sha256sum "../../release-assets/$apk_name" | awk '{print $1}')"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          node "../../scripts/generate-android-update-metadata.mjs" \
            "$version" \
            "$version_code" \
            "$apk_url" \
            "$sha256" \
            "$published_at" \
            "../release-notes.md" \
            > "../../release-assets/latest-android.json"
          
          cat ../../release-assets/latest-android.json

      - name: Save Android APK
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to Orchard R2
    needs:
      - prepare
      - build-linux
      - build-linux-arm64
      - build-arch
      - build-windows
      - build-windows-arm64
      - build-macos
      - build-android
    # A mobile-only run skips every desktop build, while an unchanged Android version
    # skips the APK build. Accept those intentional skips without accepting failures.
    if: >-
      always()
      && needs.prepare.result == 'success'
      && (needs.prepare.outputs.build_android != 'true' || needs.build-android.result == 'success')
      && (needs.prepare.outputs.mobile_only != 'true' || needs.prepare.outputs.build_android == 'true')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && needs.prepare.outputs.is_beta != 'true'
      && inputs.build_only != true
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Check out release utilities
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Verify upload tools
        run: |
          aws --version
          node --version

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Merge macOS update metadata
        if: needs.prepare.outputs.mobile_only != 'true'
        run: |
          set -euo pipefail
          node scripts/merge-macos-update-metadata.mjs \
            release-assets/latest-mac-x64.yml \
            release-assets/latest-mac-arm64.yml \
            release-assets/latest-mac.yml
          rm release-assets/latest-mac-x64.yml release-assets/latest-mac-arm64.yml

      - name: Merge Windows update metadata
        if: needs.prepare.outputs.mobile_only != 'true'
        run: |
          set -euo pipefail
          node scripts/merge-windows-update-metadata.mjs \
            release-assets/latest.yml \
            release-assets/latest-windows-arm64.yml \
            release-assets/latest.yml
          rm release-assets/latest-windows-arm64.yml

      - name: Generate checksums
        env:
          MOBILE_ONLY: ${{ needs.prepare.outputs.mobile_only }}
        run: |
          set -euo pipefail
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          # SHA256SUMS.txt has a fixed name in the bucket, so a mobile-only run publishing
          # under it would replace the desktop checksum list with a single APK line. Mobile
          # gets its own file instead, leaving the desktop manifest from the last full
          # release intact.
          sums="SHA256SUMS.txt"
          if [[ "$MOBILE_ONLY" == "true" ]]; then
            sums="SHA256SUMS-mobile.txt"
          fi
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS*.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > "$sums"
          )
          cat "release-assets/$sums"

      - name: Upload versioned release artifacts
        run: |
          set -euo pipefail
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          aws s3 cp release-assets/ "s3://$R2_BUCKET/orchard/" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude 'latest*.yml' \
            --exclude 'latest*.json' \
            --recursive

      - name: Publish desktop updater manifests
        if: needs.prepare.outputs.mobile_only != 'true'
        run: |
          set -euo pipefail

          # Upload YAML manifests
          for manifest in latest.yml latest-linux.yml latest-linux-arm64.yml latest-mac.yml; do
            test -f "release-assets/$manifest"
            aws s3 cp "release-assets/$manifest" "s3://$R2_BUCKET/orchard/$manifest" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type application/yaml \
              --cache-control no-cache
          done

      - name: Publish Android updater manifest
        if: needs.prepare.outputs.build_android == 'true'
        run: |
          set -euo pipefail

          # Uploaded separately from the YAML manifests for the correct content-type
          test -f "release-assets/latest-android.json"
          aws s3 cp "release-assets/latest-android.json" "s3://$R2_BUCKET/orchard/latest-android.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control no-cache

  publish-github-beta:
    name: Publish beta to GitHub Releases
    needs:
      - prepare
      - build-linux
      - build-linux-arm64
      - build-arch
      - build-windows
      - build-windows-arm64
      - build-macos
      - build-android
    # See the publish job: intentional desktop or Android skips must not skip this one.
    if: >-
      always()
      && needs.prepare.result == 'success'
      && (needs.prepare.outputs.build_android != 'true' || needs.build-android.result == 'success')
      && (needs.prepare.outputs.mobile_only != 'true' || needs.prepare.outputs.build_android == 'true')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && needs.prepare.outputs.is_beta == 'true'
      && inputs.build_only != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Merge macOS update metadata
        if: needs.prepare.outputs.mobile_only != 'true'
        run: |
          set -euo pipefail
          node scripts/merge-macos-update-metadata.mjs \
            release-assets/latest-mac-x64.yml \
            release-assets/latest-mac-arm64.yml \
            release-assets/latest-mac.yml
          rm release-assets/latest-mac-x64.yml release-assets/latest-mac-arm64.yml

      - name: Merge Windows update metadata
        if: needs.prepare.outputs.mobile_only != 'true'
        run: |
          set -euo pipefail
          node scripts/merge-windows-update-metadata.mjs \
            release-assets/latest.yml \
            release-assets/latest-windows-arm64.yml \
            release-assets/latest.yml
          rm release-assets/latest-windows-arm64.yml

      - name: Generate checksums
        run: |
          set -euo pipefail
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS.txt
          )
          cat release-assets/SHA256SUMS.txt

      - name: Create GitHub prerelease
        env:
          MOBILE_ONLY: ${{ needs.prepare.outputs.mobile_only }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"

          # A mobile-only prerelease carries the mobile version and mobile notes; the
          # desktop ones describe a build this run never produced.
          notes="build/release-notes.md"
          title="Orchard $VERSION (beta)"
          if [[ "$MOBILE_ONLY" == "true" ]]; then
            notes="mobile/release-notes.md"
            title="Orchard Mobile $VERSION (beta)"
          fi

          gh release create "${{ needs.prepare.outputs.tag }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "$title" \
            --notes-file "$notes" \
            --prerelease
