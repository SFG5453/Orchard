name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag or ref to build; optional for build-only runs
        required: false
        type: string
      build_only:
        description: Build and validate artifacts without publishing them
        required: false
        default: false
        type: boolean
      mobile_only:
        description: Build and publish the Android APK alone, skipping every desktop platform
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  BUN_VERSION: '1.4.0'
  GO_VERSION: '1.24.x'
  FLATPAK_RUNTIME: '50'
  npm_config_audit: 'false'
  npm_config_fund: 'false'
  ORCHARD_UPDATE_URL: https://downloads.sfg545.dev/orchard/

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      manager_version: ${{ steps.release.outputs.manager_version }}
      is_beta: ${{ steps.release.outputs.is_beta }}
      mobile_only: ${{ steps.release.outputs.mobile_only }}
      build_android: ${{ steps.release.outputs.build_android }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate tag and package versions
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          BUILD_ONLY: ${{ inputs.build_only || false }}
          MOBILE_ONLY_INPUT: ${{ inputs.mobile_only || false }}
        run: |
          set -euo pipefail
          mobile_only="$MOBILE_ONLY_INPUT"
          version_tag="$RELEASE_TAG"
          case "$RELEASE_TAG" in
            *-mobile)
              mobile_only="true"
              version_tag="${RELEASE_TAG%-mobile}"
              ;;
          esac

          if [[ "$mobile_only" == "true" ]]; then
            version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" mobile/android/app/build.gradle)"
            version_source="mobile/android/app/build.gradle"
          else
            version="$(node -p "require('./package.json').version")"
            version_source="package.json"
          fi
          test -n "$version"

          if [[ "${BUILD_ONLY:-false}" != "true" ]]; then
            case "$version_tag" in
              v[0-9]*) ;;
              *) echo "Release tag must start with v followed by a number." >&2; exit 1 ;;
            esac
            if [[ "$version_tag" != "v$version" ]]; then
              echo "Tag $RELEASE_TAG does not match $version_source version $version." >&2
              exit 1
            fi
            git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          fi

          manager_version="$(node -p "require('./orchard-packages/package.json').version")"
          if [[ "$mobile_only" != "true" ]]; then
            expected_manager_version="${version%%.*}.0.0"
            if [[ "$manager_version" != "$expected_manager_version" ]]; then
              echo "Orchard Packages must be $expected_manager_version for Orchard $version, not $manager_version." >&2
              exit 1
            fi
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "manager_version=$manager_version" >> "$GITHUB_OUTPUT"
          echo "mobile_only=$mobile_only" >> "$GITHUB_OUTPUT"

          android_version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" mobile/android/app/build.gradle)"
          android_version_code="$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p" mobile/android/app/build.gradle)"
          test -n "$android_version"
          test -n "$android_version_code"

          build_android="true"
          if published_android="$(
            curl --fail --silent --show-error --max-time 15 \
              "${ORCHARD_UPDATE_URL}latest-android.json" |
              node -e '
                let input = "";
                process.stdin.setEncoding("utf8");
                process.stdin.on("data", (chunk) => { input += chunk; });
                process.stdin.on("end", () => {
                  try {
                    const metadata = JSON.parse(input);
                    const code = Number(metadata.versionCode);
                    if (!metadata.version || !Number.isInteger(code) || code <= 0) process.exit(1);
                    process.stdout.write(`${metadata.version}\t${code}`);
                  } catch { process.exit(1); }
                });
              '
          )"; then
            IFS=$'\t' read -r published_android_version published_android_version_code <<< "$published_android"
            if [[ "$android_version" == "$published_android_version" && "$android_version_code" == "$published_android_version_code" ]]; then
              build_android="false"
              echo "Android $android_version ($android_version_code) is already published."
            fi
          else
            echo "Could not read published Android metadata; building the APK."
          fi
          echo "build_android=$build_android" >> "$GITHUB_OUTPUT"

          is_beta="false"
          case "$version" in *-*) is_beta="true" ;; esac
          echo "is_beta=$is_beta" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        if: steps.release.outputs.mobile_only != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        if: steps.release.outputs.mobile_only != 'true'
        run: npm ci

      - name: Build native addons
        if: steps.release.outputs.mobile_only != 'true'
        run: npm run build:native

      - name: Run desktop tests
        if: steps.release.outputs.mobile_only != 'true'
        run: npm test

      - name: Set up Bun
        if: steps.release.outputs.mobile_only != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Go
        if: steps.release.outputs.mobile_only != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: orchard-packages/go.sum

      - name: Test Orchard Packages
        if: steps.release.outputs.mobile_only != 'true'
        run: |
          bun install --cwd orchard-packages --frozen-lockfile
          bun run --cwd orchard-packages test

      - name: Set up JDK 17
        if: steps.release.outputs.mobile_only == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Rust
        if: steps.release.outputs.mobile_only == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        if: steps.release.outputs.mobile_only == 'true'
        run: cargo install cargo-ndk --locked

      - name: Run mobile tests
        if: steps.release.outputs.mobile_only == 'true'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

  build-linux-arm64:
    name: Linux ARM64 packages
    needs: prepare
    if: needs.prepare.outputs.mobile_only != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: orchard-packages/go.sum

      - name: Install build tools and Flatpak runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder rpm zstd
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.gnome.Platform//${FLATPAK_RUNTIME} \
            org.gnome.Sdk//${FLATPAK_RUNTIME}

      - name: Build ARM64 native packages and manager
        run: |
          set -euo pipefail
          test "$(node -p process.arch)" = arm64
          npm ci
          npm run build:native
          node scripts/stage-package-native.mjs linux-arm64 native-inputs
          bun install --cwd orchard-packages --frozen-lockfile
          bun run --cwd orchard-packages build:release linux-arm64
          manager_version="${{ needs.prepare.outputs.manager_version }}"
          bundle="orchard-packages/dist/releases/orchard-packages-$manager_version-linux-arm64"
          mkdir -p release-assets
          ZSTD_CLEVEL=6 tar --zstd -cf \
            "release-assets/orchard-packages-$manager_version-linux-arm64.tar.zst" \
            -C "$bundle" .
          bun run --cwd orchard-packages package:linux linux-arm64
          cp artifacts/linux/linux-arm64/*.deb artifacts/linux/linux-arm64/*.rpm release-assets/
          bun run --cwd orchard-packages package:flatpak linux-arm64
          cp artifacts/flatpak/*.flatpak release-assets/

      - name: Save ARM64 native inputs
        uses: actions/upload-artifact@v7
        with:
          name: native-linux-arm64
          path: native-inputs/
          if-no-files-found: error
          retention-days: 1

      - name: Save Linux ARM64 manager packages
        uses: actions/upload-artifact@v7
        with:
          name: release-manager-linux-arm64
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Windows ${{ matrix.arch }} packages
    needs: prepare
    if: needs.prepare.outputs.mobile_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: orchard-packages/go.sum

      - name: Build native package and manager
        shell: pwsh
        run: |
          if ((node -p process.arch) -ne '${{ matrix.arch }}') { throw 'Node.js is running with the wrong architecture.' }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/stage-package-native.mjs win32-${{ matrix.arch }} native-inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun install --cwd orchard-packages --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run --cwd orchard-packages build:release win32-${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $managerVersion = '${{ needs.prepare.outputs.manager_version }}'
          $bundle = "orchard-packages/dist/releases/orchard-packages-$managerVersion-win32-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath "release-assets/orchard-packages-$managerVersion-win32-${{ matrix.arch }}.zip"
          pwsh -NoProfile -ExecutionPolicy Bypass -File orchard-packages/scripts/build-windows-installer.ps1 -Architecture '${{ matrix.arch }}'
          $installers = @(Get-ChildItem "artifacts/windows/win32-${{ matrix.arch }}" -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one Windows installer, found $($installers.Count)." }
          $installers | Copy-Item -Destination release-assets

      - name: Save Windows native inputs
        uses: actions/upload-artifact@v7
        with:
          name: native-win32-${{ matrix.arch }}
          path: native-inputs/
          if-no-files-found: error
          retention-days: 1

      - name: Save Windows manager package
        uses: actions/upload-artifact@v7
        with:
          name: release-manager-win32-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: macOS ${{ matrix.arch }} packages
    needs: prepare
    if: needs.prepare.outputs.mobile_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            file_arch: arm64
            runner: macos-15
          - arch: x64
            file_arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: orchard-packages/go.sum

      - name: Build native package and manager
        run: |
          set -euo pipefail
          test "$(node -p process.arch)" = '${{ matrix.arch }}'
          npm ci
          npm run build:native
          for addon in \
            native-audio-rust/build/orchard-audio-darwin-${{ matrix.arch }}.node \
            native-media/build/orchard-system-media-darwin-${{ matrix.arch }}.node; do
            file "$addon" | grep -q '${{ matrix.file_arch }}'
          done
          node scripts/stage-package-native.mjs darwin-${{ matrix.arch }} native-inputs
          bun install --cwd orchard-packages --frozen-lockfile
          bun run --cwd orchard-packages build:release darwin-${{ matrix.arch }}
          manager_version='${{ needs.prepare.outputs.manager_version }}'
          bundle="orchard-packages/dist/releases/orchard-packages-$manager_version-darwin-${{ matrix.arch }}"
          mkdir -p release-assets
          ditto -c -k "$bundle" \
            "release-assets/orchard-packages-$manager_version-darwin-${{ matrix.arch }}.zip"

      - name: Save macOS native inputs
        uses: actions/upload-artifact@v7
        with:
          name: native-darwin-${{ matrix.arch }}
          path: native-inputs/
          if-no-files-found: error
          retention-days: 1

      - name: Save macOS manager package
        uses: actions/upload-artifact@v7
        with:
          name: release-manager-darwin-${{ matrix.arch }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build-linux-x64:
    name: Linux x64 packages
    needs: prepare
    if: needs.prepare.outputs.mobile_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: orchard-packages/go.sum

      - name: Install build tools and Flatpak runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder rpm zstd
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.gnome.Platform//${FLATPAK_RUNTIME} \
            org.gnome.Sdk//${FLATPAK_RUNTIME}

      - name: Build x64 native packages and manager
        run: |
          set -euo pipefail
          test "$(node -p process.arch)" = x64
          npm ci
          npm run build:native
          node scripts/stage-package-native.mjs linux-x64 native-inputs
          bun install --cwd orchard-packages --frozen-lockfile
          bun run --cwd orchard-packages build:release linux-x64
          bun run --cwd orchard-packages package:linux linux-x64
          bun run --cwd orchard-packages package:flatpak linux-x64

      - name: Stage Linux x64 artifacts
        run: |
          set -euo pipefail
          manager_version="${{ needs.prepare.outputs.manager_version }}"
          bundle="orchard-packages/dist/releases/orchard-packages-$manager_version-linux-x64"
          mkdir -p release-assets
          ZSTD_CLEVEL=6 tar --zstd -cf \
            "release-assets/orchard-packages-$manager_version-linux-x64.tar.zst" \
            -C "$bundle" .
          cp artifacts/linux/linux-x64/*.deb artifacts/linux/linux-x64/*.rpm release-assets/
          cp artifacts/flatpak/*.flatpak release-assets/
          find release-assets -maxdepth 1 -type f -print

      - name: Save Linux x64 native inputs
        uses: actions/upload-artifact@v7
        with:
          name: native-linux-x64
          path: native-inputs/
          if-no-files-found: error
          retention-days: 1

      - name: Save Linux x64 manager packages
        uses: actions/upload-artifact@v7
        with:
          name: release-manager-linux-x64
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  build-arch-x64:
    name: Arch Linux x64 package
    needs: prepare
    if: needs.prepare.outputs.mobile_only != 'true'
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install Arch build tools
        run: |
          pacman -Syu --noconfirm \
            bun git go libarchive nodejs npm python unzip webkit2gtk-4.1 zstd
          useradd --create-home builder

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build Arch package
        run: |
          set -euo pipefail
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder PATH="$PATH" \
            sh -c 'cd "$1" && bun run package:orchard-packages:arch' _ "$GITHUB_WORKSPACE"

      - name: Save Arch Linux package
        uses: actions/upload-artifact@v7
        with:
          name: release-manager-arch-x64
          path: artifacts/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 1

  build-r2:
    name: Build package service artifacts
    needs: [prepare, build-linux-arm64, build-linux-x64, build-windows, build-macos]
    if: needs.prepare.outputs.mobile_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install package-service dependencies
        run: |
          npm ci
          bun install --cwd orchard-packages --frozen-lockfile

      - name: Download native inputs
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native-inputs
          merge-multiple: true

      - name: Build every R2 Orchard package
        env:
          ORCHARD_NATIVE_INPUTS: ${{ github.workspace }}/native-inputs
        run: |
          set -euo pipefail
          bun run package:orchard '${{ needs.prepare.outputs.version }}'
          node - <<'NODE'
          const manifest = require('./artifacts/r2/manifest.json');
          const expected = ['darwin-arm64', 'darwin-x64', 'linux-arm64', 'linux-x64', 'win32-arm64', 'win32-x64'];
          const actual = Object.keys(manifest.releases[0].native).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`Missing R2 native packages: ${actual.join(', ')}`);
          }
          NODE
          bun run --cwd orchard-packages verify:r2

      - name: Save package service artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-r2
          path: artifacts/r2/
          if-no-files-found: error
          retention-days: 1

  build-android:
    name: Android APK
    needs: prepare
    if: needs.prepare.outputs.build_android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orchard-release.jks"
          chmod 600 "$RUNNER_TEMP/orchard-release.jks"

      - name: Build Android APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/orchard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Package Android artifact and metadata
        working-directory: mobile/android
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          IS_BETA: ${{ needs.prepare.outputs.is_beta }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle)"
          version_code="$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*\([0-9][0-9]*\).*/\1/p" app/build.gradle)"
          apk_name="Orchard-${version}.apk"
          apk_source="app/build/outputs/apk/release/app-release.apk"
          test -n "$version"
          test -n "$version_code"
          test -f "$apk_source"
          mkdir -p ../../release-assets
          cp "$apk_source" "../../release-assets/$apk_name"
          apk_url="${ORCHARD_UPDATE_URL}${apk_name}"
          if [[ "$IS_BETA" == "true" ]]; then
            apk_url="https://github.com/${RELEASE_REPOSITORY}/releases/download/${RELEASE_TAG}/${apk_name}"
          fi
          sha256="$(sha256sum "../../release-assets/$apk_name" | awk '{print $1}')"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node "../../scripts/generate-android-update-metadata.mjs" \
            "$version" "$version_code" "$apk_url" "$sha256" "$published_at" \
            "../release-notes.md" > "../../release-assets/latest-android.json"

      - name: Save Android APK
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: release-assets/
          if-no-files-found: error
          retention-days: 1

  publish-r2:
    name: Publish package service to R2
    needs: [prepare, build-linux-arm64, build-linux-x64, build-arch-x64, build-windows, build-macos, build-r2, build-android]
    if: >-
      always()
      && needs.prepare.result == 'success'
      && (needs.prepare.outputs.build_android != 'true' || needs.build-android.result == 'success')
      && (needs.prepare.outputs.mobile_only != 'true' || needs.prepare.outputs.build_android == 'true')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && inputs.build_only != true
      && (needs.prepare.outputs.mobile_only != 'true' || needs.prepare.outputs.is_beta != 'true')
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Upload desktop packages and publish merged manifest
        if: needs.prepare.outputs.mobile_only != 'true'
        run: |
          set -euo pipefail
          test -f release-assets/manifest.json
          aws s3 cp release-assets/ "s3://$R2_BUCKET/" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude '*' \
            --include 'orchard*.tar.zst' \
            --include 'orchard*.zip' \
            --include 'orchard*.deb' \
            --include 'orchard*.rpm' \
            --include 'orchard*.exe' \
            --include 'Orchard*.exe' \
            --include 'orchard*.flatpak' \
            --recursive

          cp release-assets/manifest.json "$RUNNER_TEMP/new-manifest.json"
          if ! aws s3 cp "s3://$R2_BUCKET/manifest.json" "$RUNNER_TEMP/old-manifest.json" \
            --endpoint-url "$R2_ENDPOINT"; then
            printf '{"schemaVersion":1,"releases":[]}' > "$RUNNER_TEMP/old-manifest.json"
          fi
          node - "$RUNNER_TEMP/old-manifest.json" "$RUNNER_TEMP/new-manifest.json" release-assets/manifest.json <<'NODE'
          const fs = require('node:fs');
          const [oldPath, newPath, outputPath] = process.argv.slice(2);
          const oldManifest = JSON.parse(fs.readFileSync(oldPath, 'utf8'));
          const newManifest = JSON.parse(fs.readFileSync(newPath, 'utf8'));
          const incoming = newManifest.releases[0];
          const releases = [incoming, ...(Array.isArray(oldManifest.releases) ? oldManifest.releases : [])
            .filter((release) => release?.version !== incoming.version)].slice(0, 20);
          fs.writeFileSync(outputPath, `${JSON.stringify({ schemaVersion: 1, releases }, null, 2)}\n`);
          NODE
          aws s3 cp release-assets/manifest.json "s3://$R2_BUCKET/manifest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control no-cache

      - name: Publish stable Android update
        if: needs.prepare.outputs.is_beta != 'true' && needs.prepare.outputs.build_android == 'true'
        run: |
          set -euo pipefail
          apk="$(find release-assets -maxdepth 1 -type f -name 'Orchard-*.apk' -print -quit)"
          test -n "$apk"
          test -f release-assets/latest-android.json
          aws s3 cp "$apk" "s3://$R2_BUCKET/orchard/$(basename "$apk")" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp release-assets/latest-android.json "s3://$R2_BUCKET/orchard/latest-android.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control no-cache

      - name: Publish checksums
        run: |
          set -euo pipefail
          sums=SHA256SUMS.txt
          destination="s3://$R2_BUCKET/$sums"
          if [[ '${{ needs.prepare.outputs.mobile_only }}' == 'true' ]]; then
            sums=SHA256SUMS-mobile.txt
            destination="s3://$R2_BUCKET/orchard/$sums"
          fi
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS*.txt' -print0 \
              | sort -z | xargs -0 sha256sum > "$sums"
          )
          aws s3 cp "release-assets/$sums" "$destination" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type text/plain \
            --cache-control no-cache

  publish-github-beta:
    name: Publish beta to GitHub Releases
    needs: [prepare, build-linux-arm64, build-linux-x64, build-arch-x64, build-windows, build-macos, build-r2, build-android]
    if: >-
      always()
      && needs.prepare.result == 'success'
      && (needs.prepare.outputs.build_android != 'true' || needs.build-android.result == 'success')
      && (needs.prepare.outputs.mobile_only != 'true' || needs.prepare.outputs.build_android == 'true')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
      && needs.prepare.outputs.is_beta == 'true'
      && inputs.build_only != true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
              | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

      - name: Create GitHub prerelease
        env:
          MOBILE_ONLY: ${{ needs.prepare.outputs.mobile_only }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          notes=build/release-notes.md
          title="Orchard $VERSION (beta)"
          if [[ "$MOBILE_ONLY" == "true" ]]; then
            notes=mobile/release-notes.md
            title="Orchard Mobile $VERSION (beta)"
          fi
          gh release create '${{ needs.prepare.outputs.tag }}' release-assets/* \
            --repo '${{ github.repository }}' \
            --title "$title" \
            --notes-file "$notes" \
            --prerelease
