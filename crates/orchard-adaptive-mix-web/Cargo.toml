[package]
name = "orchard-adaptive-mix-web"
version = "0.1.0"
edition = "2024"
license-file = "../orchard-adaptive-mix/LICENSE"
publish = false

# wasm32-wasip1 build of adaptive mix for the Apple Music player page.
[lib]
crate-type = ["cdylib"]

[dependencies]
earmark = { path = "../earmark" }
orchard-adaptive-mix = { path = "../orchard-adaptive-mix", default-features = false, features = ["web"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
panic = "abort"
